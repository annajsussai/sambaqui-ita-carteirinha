<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificação de Carteirinha | Sambaqui Itanhaém</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary:       #4B1D71;
            --primary-light: #6A2C9D;
            --accent:        #27AE60;
            --danger:        #E74C3C;
            --bg-page:       #DDE6D5;
            --card-white:    #FFFFFF;
            --text-main:     #1A1A1A;
            --text-muted:    #636E72;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: var(--bg-page);
            background-image: radial-gradient(circle at 2px 2px, rgba(0,0,0,0.04) 1px, transparent 0);
            background-size: 24px 24px;
            min-height: 100vh;
            font-family: 'DM Sans', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 32px 16px 48px;
            gap: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* LOGO */
        .logo-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 4px;
        }

        .logo-circle {
            width: 48px; height: 48px;
            background: var(--primary);
            border-radius: 50%;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 12px rgba(75,29,113,.25);
        }

        .logo-circle img { width: 100%; height: 100%; object-fit: contain; }

        .logo-text span {
            display: block;
            font-family: 'DM Serif Display', serif;
            font-size: 9px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.5px;
            color: var(--text-muted);
        }

        .logo-text strong {
            font-family: 'DM Serif Display', serif;
            font-size: .95rem; font-weight: 800;
            color: var(--primary); line-height: 1.2;
        }

        /* BUSCA */
        .search-card {
            background: white;
            border-radius: 18px;
            padding: 22px 22px 18px;
            box-shadow: 0 8px 24px -4px rgba(0,0,0,0.08);
        }

        .search-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.05rem;
            color: var(--primary);
            margin-bottom: 4px;
        }

        .search-sub {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 14px;
            line-height: 1.5;
        }

        .field {
            margin-bottom: 18px;
        }

        .field label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            color: var(--primary);
            margin-bottom: 7px;
        }

        .field-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
        }

        .field-wrapper input {
            flex: 1;
        }

        .field input {
            width: 100%;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            border: 2px solid #e8e8e8;
            border-radius: 12px;
            padding: 11px 14px;
            color: var(--text-main);
            outline: none;
            transition: border-color .2s, box-shadow .2s;
            background: #fafafa;
        }

        .field input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px rgba(106,44,157,0.08);
            background: white;
        }

        .field input::placeholder { color: #c0c0c0; }

        .field-hint {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 5px;
            display: block;
        }

        .btn-buscar {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 12px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: background .2s, transform .1s;
            box-shadow: 0 4px 12px rgba(75,29,113,.28);
        }

        .btn-buscar:hover  { background: var(--primary-light); }
        .btn-buscar:active { transform: scale(0.97); }
        .btn-buscar:disabled { opacity: .6; cursor: default; transform: none; }

        /* CARD RESULTADO */
        .result-card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px -8px rgba(0,0,0,0.12);
            display: none;
        }

        .result-card.visible { display: block; }

        /* STATUS */
        .status-bar {
            padding: 20px 24px;
            display: flex;
            align-items: center;
            gap: 14px;
            color: white;
        }

        .status-bar.valido   { background: var(--accent); }
        .status-bar.invalido { background: var(--danger); }
        .status-bar.loading  { background: var(--primary); }

        .status-icon { font-size: 2rem; flex-shrink: 0; }

        .status-title {
            font-family: 'DM Serif Display', serif;
            font-size: 1.2rem; line-height: 1.2;
        }

        .status-sub { font-size: 12px; opacity: .85; margin-top: 2px; }

        /* DADOS ALUNO */
        .aluno-dados { padding: 24px; }

        .dado-row {
            display: flex;
            flex-direction: column;
            margin-bottom: 18px;
        }

        .dado-row:last-child { margin-bottom: 0; }

        .dado-label {
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 1.2px;
            color: var(--text-muted); margin-bottom: 3px;
        }

        .dado-value {
            font-size: 1rem; font-weight: 600;
            color: var(--text-main);
        }

        .dado-value.nome {
            font-family: 'DM Serif Display', serif;
            font-size: 1.25rem; color: var(--primary);
        }

        hr.divider {
            border: none; border-top: 1px solid #F0F0F0;
            margin: 0 0 18px;
        }

        .selo {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f0fff4;
            border: 1px solid #b7ebc8;
            border-radius: 10px;
            padding: 10px 14px;
            margin: 0 24px 0;
            font-size: 12px;
            color: #1a6b35;
            font-weight: 500;
        }

        .selo svg { flex-shrink: 0; }

        /* RODAPÉ CARD */
        .card-footer-note {
            padding: 16px 24px;
            font-size: 11px;
            color: var(--text-muted);
            background: #fafafa;
            border-top: 1px solid #f0f0f0;
            line-height: 1.6;
        }

        /* MENSAGENS */
        .msg {
            padding: 12px;
            border-radius: 10px;
            font-size: 13px;
            text-align: center;
            display: none;
        }

        .msg.visible { display: block; }
        .msg.erro    { background: #ffe6e6; color: #c41e3a; border-left: 4px solid #c41e3a; text-align: left; }
        .msg.loading { background: #e6f2ff; color: #0066cc; border-left: 4px solid #0066cc; text-align: left; }

        /* LOADING DOTS */
        .loading-dots {
            display: flex;
            gap: 4px;
        }

        .loading-dots span {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: white;
            animation: pulse 1.4s infinite;
        }

        .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
        .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* BOTÃO VOLTAR */
        .btn-voltar {
            text-align: center;
            color: var(--primary);
            text-decoration: none;
            font-size: 13px;
            font-weight: 600;
            padding: 10px;
            border-radius: 8px;
            transition: background .2s;
        }

        .btn-voltar:hover { background: rgba(75,29,113,0.08); }

        @media (max-width: 480px) {
            body { padding: 20px 12px 32px; }
            .search-card { padding: 18px 16px 14px; }
        }
    </style>
</head>

        </div>
        <div class="logo-text">
            <span>Verificação de Autenticidade</span>
            <strong>Carteirinha Sambaqui</strong>
        </div>
    </div>

    <!-- BUSCA POR ID -->
    <div class="search-card" id="searchCard">
        <h2 class="search-title">Consultar por ID</h2>
        <p class="search-sub">Digite os últimos 6 números do código de registro para verificar qualquer carteirinha.</p>

        <div class="field">
            <div class="field-wrapper">
                <input type="text" id="inputId"
                       placeholder="444444"
                       inputmode="numeric"
                       autocomplete="off"
                       spellcheck="false"
                       maxlength="6">
                <button class="btn-buscar" id="btnBuscar" onclick="verificarPorId()" style="width: auto; padding: 11px 24px; margin-top: 0;">Verificar</button>
            </div>
        </div>

        <div class="msg" id="msgResultado"></div>
    </div>

    <!-- RESULTADO -->
    <div class="result-card" id="resultCard">
        <div class="status-bar loading" id="statusBar">
            <div class="status-icon">
                <div class="loading-dots"><span></span><span></span><span></span></div>
            </div>
            <div>
                <div class="status-title">Verificando…</div>
                <div class="status-sub">Consultando base de dados</div>
            </div>
        </div>
        <div class="aluno-dados" id="alunoConteudo" style="display:none"></div>
    </div>

    <a href="/" class="btn-voltar">← Voltar ao início</a>
</div>

<script>
// ---------- helpers --------------------------------------------------
function escHtml(str) {
    return String(str || '')
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function agora() {
    return new Date().toLocaleString('pt-BR', {
        timeZone:'America/Sao_Paulo',
        day:'2-digit', month:'2-digit', year:'numeric',
        hour:'2-digit', minute:'2-digit'
    });
}

function showMsg(texto, tipo) {
    const el = document.getElementById('msgResultado');
    el.textContent = texto;
    el.className = `msg visible ${tipo}`;
}

function hideMsg() {
    const el = document.getElementById('msgResultado');
    el.className = 'msg';
    el.textContent = '';
}

// ---------- exibição --------------------------------------------------
    
function mostrarErro(msg) {
    const card = document.getElementById('resultCard');
    card.classList.add('visible');
    document.getElementById('statusBar').className = 'status-bar invalido';
    document.getElementById('statusBar').innerHTML = `
        <div class="status-icon">✗</div>
        <div>
            <div class="status-title">Não encontrado</div>
            <div class="status-sub">${escHtml(msg)}</div>
        </div>`;
    document.getElementById('alunoConteudo').style.display = 'none';
    
    const old = document.getElementById('cardFooter');
    if (old) old.remove();
}

function mostrarSucesso(data) {
    const card = document.getElementById('resultCard');
    card.classList.add('visible');

    document.getElementById('statusBar').className = 'status-bar valido';
    document.getElementById('statusBar').innerHTML = `
        <div class="status-icon">✓</div>
        <div>
            <div class="status-title">Carteirinha Válida</div>
            <div class="status-sub">Documento autêntico verificado</div>
        </div>`;

    const cont = document.getElementById('alunoConteudo');
    cont.style.display = 'block';
    cont.innerHTML = `
        <div class="dado-row">
            <span class="dado-label">Nome do Estudante</span>
            <span class="dado-value nome">${escHtml(data.nome)}</span>
        </div>
        <hr class="divider">
        <div class="dado-row">
            <span class="dado-label">Código de Registro</span>
            <span class="dado-value">${escHtml(data.codigo)}</span>
        </div>
        <div class="dado-row">
            <span class="dado-label">Ano de Nascimento</span>
            <span class="dado-value">${escHtml(data.ano)}</span>
        </div>
        <div class="dado-row">
            <span class="dado-label">Validade</span>
            <span class="dado-value">${escHtml(data.validade)}</span>
        </div>
        <div class="dado-row">
            <span class="dado-label">Emitido por</span>
            <span class="dado-value">${escHtml(data.emitido_por)}</span>
        </div>
        <div class="selo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.5"
                 stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                <polyline points="9 12 11 14 15 10"/>
            </svg>
            Verificado em ${agora()} (horário de Brasília)
        </div>`;

    const old = document.getElementById('cardFooter');
    if (old) old.remove();

    const footer = document.createElement('div');
    footer.id = 'cardFooter';
    footer.className = 'card-footer-note';
    footer.textContent = 'Esta página confirma que o portador está regularmente matriculado no Cursinho Comunitário Sambaqui Itanhaém. Em caso de dúvidas, entre em contato com a coordenação.';
    card.appendChild(footer);
}

function mostrarLoading() {
    const card = document.getElementById('resultCard');
    card.classList.add('visible');
    document.getElementById('statusBar').className = 'status-bar loading';
    document.getElementById('statusBar').innerHTML = `
        <div class="status-icon">
            <div class="loading-dots"><span></span><span></span><span></span></div>
        </div>
        <div>
            <div class="status-title">Verificando…</div>
            <div class="status-sub">Consultando base de dados</div>
        </div>`;
    document.getElementById('alunoConteudo').style.display = 'none';
    const old = document.getElementById('cardFooter');
    if (old) old.remove();
}

// ---------- VERIFICAÇÃO POR ID (últimos 6 dígitos) ---------------------------------
async function verificarPorId(tentativa = 1) {
    const id = document.getElementById('inputId').value.trim();

    if (!id) {
        showMsg('⚠️ Digite os últimos 6 números', 'erro');
        return;
    }

    if (!/^\d{1,6}$/.test(id)) {
        showMsg('⚠️ Digite apenas números', 'erro');
        return;
    }

    const btn = document.getElementById('btnBuscar');
    btn.disabled = true;

    const maxTentativas = 5;
    if (tentativa === 1) {
        showMsg('🔍 Verificando dados…', 'loading');
        mostrarLoading();
    } else {
        showMsg(`⏳ Aguardando servidor acordar… (tentativa ${tentativa}/${maxTentativas})`, 'loading');
    }

    try {
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 10000);

        const resp = await fetch(`/api/validar/${id}`, { signal: controller.signal });
        clearTimeout(timeout);
        const data = await resp.json();

        if (!resp.ok || !data.valido) {
            hideMsg();
            mostrarErro('Carteirinha não encontrada ou inválida');
            btn.disabled = false;
            return;
        }

        hideMsg();
        mostrarSucesso({
            nome: data.nome,
            codigo: data.codigo,
            ano: data.ano,
            validade: data.validade,
            emitido_por: data.emitido_por
        });
        setTimeout(() => {
            document.getElementById('resultCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
        }, 100);

    } catch (err) {
        // Se falhou e ainda tem tentativas, tenta de novo após 4 segundos
        if (tentativa < maxTentativas) {
            setTimeout(() => verificarPorId(tentativa + 1), 4000);
            return;
        }
        console.error('Erro ao verificar:', err);
        hideMsg();
        mostrarErro('Não foi possível conectar ao servidor. Tente novamente.');
    } finally {
        if (tentativa >= maxTentativas) btn.disabled = false;
    }
}

// ---------- DETECTAR SE VEM DE QRCODE (URL com :id) ---------------------------------
(function() {
    const pathArray = window.location.pathname.split('/');
    const id = pathArray[pathArray.length - 1];

    if (id && /^\d+$/.test(id)) {
        // Aguarda o DOM e todos os listeners estarem prontos
        document.addEventListener('DOMContentLoaded', function() {
            const input = document.getElementById('inputId');
            input.value = id.replace(/\D/g, '').slice(0, 6);
            setTimeout(verificarPorId, 100);
        });
        window.addEventListener('load', function() {
            const input = document.getElementById('inputId');
            if (!input.value) {
                input.value = id.replace(/\D/g, '').slice(0, 6);
            }
            if (input.value) verificarPorId();
        });
    }
})();

// ---------- EVENTOS -----------------------------------------
document.getElementById('inputId').addEventListener('keydown', e => {
    if (e.key === 'Enter') verificarPorId();
});

// Mascara para aceitar apenas números
document.getElementById('inputId').addEventListener('input', function() {
    this.value = this.value.replace(/\D/g, '').slice(0, 6);
});
</script>
